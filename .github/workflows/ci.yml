name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by publish.yml, so a release runs exactly these checks and ships the packages built here.
  workflow_call:
    inputs:
      version:
        description: The package version, taken from the release's tag
        type: string
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet tool run csharpier check .
      - run: dotnet test
      - run: dotnet pack src/Subrange -c Release -o artifacts ${VERSION:+-p:Version=$VERSION}
      - run: dotnet pack src/Subrange.Swashbuckle -c Release -o artifacts ${VERSION:+-p:Version=$VERSION}
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: artifacts/*.nupkg
